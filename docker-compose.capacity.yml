name: knowpliot-capacity

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.docker
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,stream-gateway,nginx,host.docker.internal
  POSTGRES_DB: knowpilot
  POSTGRES_USER: knowpilot
  POSTGRES_PASSWORD: knowpilot_password
  POSTGRES_HOST: pgbouncer
  POSTGRES_PORT: "6432"
  CONN_MAX_AGE: "0"
  DISABLE_SERVER_SIDE_CURSORS: "true"
  REDIS_URL: redis://redis-broker:6379/1
  RATE_LIMIT_REDIS_URL: redis://redis-broker:6379/2
  CELERY_BROKER_URL: redis://redis-broker:6379/0
  CELERY_RESULT_BACKEND: redis://redis-broker:6379/3
  CHAT_EVENTS_REDIS_URL: redis://redis-events:6379/0
  CHAT_CAPACITY_REDIS_URL: redis://redis-events:6379/1
  CHAT_STREAM_V3: "true"
  CHAT_GENERATION_TARGET_ACTIVE: "500"
  CHAT_GENERATION_MAX_OUTSTANDING: "625"
  CHAT_GENERATION_WORKER_CONCURRENCY: "25"
  PROVIDER_HTTP_MAX_CONNECTIONS: "32"
  PROVIDER_HTTP_MAX_KEEPALIVE_CONNECTIONS: "16"
  PROMETHEUS_METRICS_TOKEN: metrics-token-change-me
  PROMETHEUS_MULTIPROC_DIR: /prometheus-multiproc
  CAPACITY_SEED_ALLOWED: "true"
  DASHSCOPE_API_KEY: ${CAPACITY_PROVIDER_KEY:-capacity-mock-key}
  LITELLM_BASE_URL: ${CAPACITY_LITELLM_BASE_URL:-http://mock-provider:4010/v1}
  PROVIDER_MAX_OUTPUT_TOKENS: ${CAPACITY_PROVIDER_MAX_OUTPUT_TOKENS:-512}

services:
  metrics-init:
    image: alpine:3.20
    command: sh -c "rm -f /prometheus-multiproc/*.db"
    volumes:
      - capacity_prometheus_multiproc:/prometheus-multiproc
    restart: "no"

  db:
    image: pgvector/pgvector:pg16
    command: postgres -c max_connections=120 -c shared_buffers=256MB
    environment:
      POSTGRES_DB: knowpilot
      POSTGRES_USER: knowpilot
      POSTGRES_PASSWORD: knowpilot_password
    volumes:
      - capacity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowpilot"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    command: pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./deploy/capacity/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./deploy/capacity/userlist.txt.example:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U knowpilot"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  redis-broker:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - capacity_redis_broker:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  redis-events:
    image: redis:7-alpine
    command: redis-server --appendonly no --maxmemory 768mb --maxmemory-policy volatile-lru
    volumes:
      - capacity_redis_events:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  mock-provider:
    image: node:22-alpine
    working_dir: /lab
    command: node mock-provider.mjs
    environment:
      MOCK_PROVIDER_PORT: "4010"
      MOCK_PROVIDER_TOKEN_COUNT: "32"
      MOCK_PROVIDER_TOKEN_DELAY_MS: "20"
    volumes:
      - ./tests/stress/mock-provider.mjs:/lab/mock-provider.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4010/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 512M}

  web:
    image: knowpliot-capacity-backend:latest
    build: *backend-build
    environment: *backend-env
    env_file: [.env]
    command: >-
      sh -c "mkdir -p /prometheus-multiproc &&
      python manage.py migrate --no-input &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 8 --threads 16 --worker-class gthread
      --timeout 120 --graceful-timeout 30"
    volumes:
      - capacity_prometheus_multiproc:/prometheus-multiproc
    depends_on:
      metrics-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/v1/internal/metrics/', headers={'Authorization':'Bearer metrics-token-change-me'}); urllib.request.urlopen(request, timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 3G}

  stream-gateway:
    image: knowpliot-capacity-backend:latest
    build: *backend-build
    environment: *backend-env
    env_file: [.env]
    command: >-
      sh -c "mkdir -p /prometheus-multiproc &&
      uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers 8"
    volumes:
      - capacity_prometheus_multiproc:/prometheus-multiproc
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 2G}

  chat-generation-worker:
    image: knowpliot-capacity-backend:latest
    build: *backend-build
    environment: *backend-env
    env_file: [.env]
    command: >-
      sh -c "mkdir -p /prometheus-multiproc &&
      celery -A config worker -Q chat_generation --pool=threads --concurrency=25 --prefetch-multiplier=1 -l info"
    volumes:
      - capacity_prometheus_multiproc:/prometheus-multiproc
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 4G}

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "18080:8080"
    volumes:
      - ./deploy/capacity/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      stream-gateway:
        condition: service_started
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

  prometheus:
    image: prom/prometheus:v2.55.1
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/capacity/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - capacity_prometheus:/prometheus
    depends_on: [web, stream-gateway]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

volumes:
  capacity_pgdata:
  capacity_redis_broker:
  capacity_redis_events:
  capacity_prometheus:
  capacity_prometheus_multiproc:
